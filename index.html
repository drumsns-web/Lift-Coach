<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LIFT COACH</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0c0e; --bg2:#101317; --surf:#15191e; --surf2:#1c2127;
  --line:#262c34; --txt:#eef1f3; --dim:#8a929c; --dim2:#5b636d;
  --acid:#c8f000; --acidd:#3a4400;
  --chest:#ff5247; --shoulder:#ff9f1c; --arm:#ffd23f; --back:#a855f7;
  --leg:#3bc9db; --abs:#4dd97a; --cardio:#65a6ff;
  --danger:#ff5247;
  --jp:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  --num:"Oswald",-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:var(--jp);font-size:16px;line-height:1.5;overflow:hidden;padding-top:env(safe-area-inset-top)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,textarea,select{outline:none}
.num{font-family:var(--num);font-feature-settings:"tnum"}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{padding:13px 18px 11px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg)}
.brand b{font-family:var(--num);font-weight:700;font-size:21px;letter-spacing:.04em}
.brand b span{color:var(--acid)}
.hbtns{display:flex;gap:8px}
.iconbtn{width:38px;height:38px;border-radius:11px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--line)}
.iconbtn:active{background:var(--surf2)}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 120px}
#app.kp-open main{padding-bottom:300px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(12,14,17,.93);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim2);font-size:10px;font-weight:700;padding:5px 0;border-radius:12px}
nav button .ic{font-size:19px;line-height:1}
nav button.on{color:var(--acid)}
#app.kp-open nav{display:none}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.datebar .dnav{width:40px;height:40px;border-radius:12px;background:var(--surf);display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--dim);border:1px solid var(--line)}
.datebar .dnav:active{background:var(--surf2)}
.dcenter{flex:1;text-align:center}
.dcenter .d{font-family:var(--num);font-weight:600;font-size:20px;letter-spacing:.02em}
.dcenter .w{font-size:11px;color:var(--dim);font-weight:700}
.today-pill{color:var(--acid);font-size:11px;font-weight:700;border:1px solid var(--acidd);background:rgba(200,240,0,.06);padding:3px 9px;border-radius:99px}

/* interval chips */
.ivstrip{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch}
.ivstrip::-webkit-scrollbar{display:none}
.ivchip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surf);border:1px solid var(--line);border-radius:99px;padding:6px 11px;font-size:12px;font-weight:700}
.ivchip .dot{width:8px;height:8px;border-radius:99px}
.ivchip .d{font-family:var(--num);color:var(--dim)}
.ivchip.fresh .d{color:var(--acid)}

/* exercise card */
.card{background:var(--surf);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:11px;padding:14px 14px 8px}
.bar{width:5px;align-self:stretch;border-radius:99px;flex:none;min-height:34px}
.card-h .nm{flex:1;font-weight:700;font-size:16px;line-height:1.25}
.card-h .ord{font-family:var(--num);font-size:12px;color:var(--dim2);font-weight:600}
.card-h .vol{font-family:var(--num);font-size:13px;color:var(--dim);font-weight:600;white-space:nowrap}
.card-h .x{color:var(--dim2);font-size:20px;padding:2px 4px}

.prevline{margin:0 12px 8px;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:8px 11px;font-size:11.5px;color:var(--dim);line-height:1.6}
.prevline .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.prevline .hd b{color:var(--txt);font-weight:700}
.prevline .ago{font-family:var(--num);color:var(--acid);font-weight:600}
.prevline .sets b{color:var(--txt);font-family:var(--num)}
.prevline .copyprev{color:var(--acid);font-weight:700;font-size:11px;border:1px solid var(--acidd);border-radius:8px;padding:3px 8px;margin-top:6px;display:inline-block}

.sets{padding:0 12px 4px}
.srow{display:grid;grid-template-columns:32px 1fr 1fr 1fr;gap:7px;align-items:center;margin-bottom:7px}
.srow .sl{font-family:var(--num);font-size:13px;color:var(--dim2);font-weight:600;text-align:center}
.cell{background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px}
.cell .lab{font-size:9px;color:var(--dim2);font-weight:700;letter-spacing:.04em}
.kfield{width:100%;text-align:center;background:none;border:none;font-family:var(--num);font-weight:600;font-size:18px;padding:1px 0}
.kfield::placeholder{color:var(--dim2);opacity:.55}
.cell.rpe .kfield{color:var(--acid)}
.cell.kactive{border-color:var(--acid);box-shadow:0 0 0 2px rgba(200,240,0,.2)}

.e1rm{font-family:var(--num);font-size:11px;color:var(--dim);text-align:right;padding:0 6px 7px;font-weight:600}
.e1rm b{color:var(--txt)}
.setadj{display:flex;gap:8px;padding:2px 12px 10px}
.setadj button{flex:1;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:7px;font-weight:700;font-size:13px;color:var(--dim)}
.setadj button:active{background:var(--bg2)}
.setadj button.add{color:var(--acid)}

.coach{margin:0 12px 12px;background:linear-gradient(180deg,rgba(200,240,0,.05),rgba(200,240,0,.01));border:1px solid var(--acidd);border-radius:13px;padding:11px 13px}
.coach .ttl{font-size:10px;letter-spacing:.14em;color:var(--acid);font-weight:700;margin-bottom:5px}
.coach .msg{font-size:13.5px;line-height:1.55}
.coach .msg b{color:var(--acid);font-family:var(--num);font-weight:600}
.coach .acts{display:flex;gap:8px;margin-top:10px}
.coach .acts button{flex:1;border-radius:10px;padding:9px;font-weight:700;font-size:12.5px}
.btn-copy{background:var(--surf2);border:1px solid var(--line);color:var(--txt)}
.btn-ai{background:var(--acid);color:#10130a}
.btn-copy:active{background:var(--bg2)}.btn-ai:active{filter:brightness(.9)}

.memo{margin:0 12px 12px}
.memo input{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:14px}
.memo input::placeholder{color:var(--dim2)}

.addex{width:100%;border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--dim);font-weight:700;font-size:14px;background:var(--bg2)}
.addex:active{border-color:var(--acid);color:var(--acid)}
.empty-day{text-align:center;color:var(--dim2);padding:30px 16px 20px;font-size:14px}
.empty-day .big{font-size:34px;margin-bottom:10px}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.calhead .mt{font-family:var(--num);font-size:21px;font-weight:600}
.calhead .nav2{display:flex;gap:8px}
.calhead .nav2 button{width:36px;height:36px;border-radius:11px;background:var(--surf);border:1px solid var(--line);color:var(--dim);font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cawd{text-align:center;font-size:11px;color:var(--dim2);font-weight:700;padding:4px 0}
.caday{aspect-ratio:1/1.05;border-radius:11px;background:var(--surf);border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;position:relative}
.caday.empty{background:none}
.caday .dn{font-family:var(--num);font-size:14px;font-weight:600;color:var(--dim)}
.caday.has .dn{color:var(--txt)}
.caday.today{border-color:var(--acid)}
.caday.today .dn{color:var(--acid)}
.caday.sel{background:var(--surf2)}
.cadots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap;justify-content:center;max-width:80%}
.cadots i{width:5px;height:5px;border-radius:99px}
.callegend{display:flex;flex-wrap:wrap;gap:8px 12px;margin:16px 2px 6px}
.callegend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);font-weight:700}
.callegend i{width:9px;height:9px;border-radius:99px}

/* program */
.progday{background:var(--surf);border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:11px}
.progday.todayp{border-color:var(--acid)}
.progday .ph{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.progday .wd{width:30px;height:30px;border-radius:9px;background:var(--surf2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.progday.todayp .wd{background:var(--acid);color:#0a0c0e}
.progday .pt{flex:1;font-weight:700;font-size:15px}
.progday .pt.dimp{color:var(--dim2);font-weight:500}
.progday .edit{color:var(--dim);font-size:13px;font-weight:700;padding:2px 4px}
.progchips{display:flex;flex-wrap:wrap;gap:6px}
.progchip{background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;display:flex;align-items:center;gap:6px}
.progchip i{width:6px;height:6px;border-radius:99px}
.progadd{margin-top:9px;display:flex;gap:8px}
.progadd button{flex:1;border-radius:10px;padding:8px;font-weight:700;font-size:12.5px;background:var(--surf2);border:1px solid var(--line);color:var(--dim)}
.progadd button.load{color:var(--acid)}

/* RM */
.rmtable{width:100%;border-collapse:collapse;margin-top:6px}
.rmtable th,.rmtable td{padding:8px 4px;text-align:center;font-family:var(--num);font-size:14px;border-bottom:1px solid var(--line)}
.rmtable th{color:var(--dim);font-size:11px;font-weight:700}
.rmtable td b{color:var(--acid)}
.hint{font-size:12px;color:var(--dim);line-height:1.6;margin-top:10px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--bg2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);max-height:90vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:99px;margin:9px auto 4px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px}
.sheet-h .t{font-weight:700;font-size:17px}
.sheet-h .close{color:var(--dim);font-size:15px;font-weight:700}
.sheet-body{overflow-y:auto;padding:4px 18px 20px;-webkit-overflow-scrolling:touch}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--dim);font-weight:700;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:15px}
.field textarea{resize:none;min-height:64px}
.catpick{display:flex;flex-wrap:wrap;gap:7px}
.catpick button,.segpick button{padding:8px 13px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--dim)}
.catpick button.on{color:#0a0c0e}
.segpick{display:flex;flex-wrap:wrap;gap:7px}
.segpick button.on{background:var(--acid);color:#0a0c0e;border-color:var(--acid)}
.primary{width:100%;background:var(--acid);color:#10130a;border-radius:13px;padding:14px;font-weight:700;font-size:15px;margin-top:4px}
.primary:active{filter:brightness(.9)}
.ghost{width:100%;background:var(--surf);border:1px solid var(--line);border-radius:13px;padding:13px;font-weight:700;font-size:14px;color:var(--dim);margin-top:9px}
.pickrow{display:flex;align-items:center;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line)}
.pickrow .nm{flex:1;font-weight:500}
.cats{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;padding:8px 15px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--dim)}
.cats button.on{background:var(--txt);color:#0a0c0e;border-color:var(--txt)}
.exrow{display:flex;align-items:center;gap:11px;padding:13px 4px;border-bottom:1px solid var(--line)}
.exrow .bar{min-height:24px}
.exrow .nm{flex:1;font-weight:500}
.exrow .pr{font-family:var(--num);font-size:13px;color:var(--dim);font-weight:600}
.exrow .add{color:var(--acid);font-size:24px;width:30px;text-align:center}
.exrow .del{color:var(--dim2);font-size:16px;padding:4px 8px}

/* keypad */
#kpad{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg2);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .2s ease;padding:8px 10px calc(10px + env(safe-area-inset-bottom))}
#kpad.on{transform:translateY(0)}
.kp-info{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px}
.kp-info .lbl{font-size:12px;color:var(--dim);font-weight:700}
.kp-info .val{font-family:var(--num);font-size:26px;font-weight:700}
.kp-info .val small{font-size:13px;color:var(--dim)}
.kp-info .done{background:var(--acid);color:#0a0c0e;font-weight:700;border-radius:11px;padding:9px 18px;font-size:14px}
.kp-quick{display:flex;gap:7px;margin-bottom:7px}
.kp-quick button{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--dim)}
.kp-quick button.prev{color:var(--acid)}
.kp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.kp-grid button{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:15px 0;font-family:var(--num);font-size:22px;font-weight:600}
.kp-grid button:active{background:var(--surf2)}
.kp-grid button.op{color:var(--acid);font-size:18px}
.kp-grid button.span2{grid-column:span 1}

.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#0a0c0e;padding:10px 18px;border-radius:99px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* chat */
.chat{display:flex;flex-direction:column;height:74vh}
.chat-top{display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.chat-top .goal{font-size:12px;color:var(--dim);font-weight:700}
.chat-top .goal b{color:var(--acid)}
.chat-top .nw{font-size:12px;color:var(--dim);font-weight:700;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 2px 12px;display:flex;flex-direction:column;gap:10px;-webkit-overflow-scrolling:touch}
.bub{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.bub.u{align-self:flex-end;background:var(--acid);color:#10130a;border-bottom-right-radius:5px;font-weight:500}
.bub.a{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:5px}
.chat-in{display:flex;gap:8px;padding:10px 0 4px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:15px;resize:none;max-height:120px}
.chat-in button{width:50px;border-radius:14px;background:var(--acid);color:#10130a;font-size:20px;font-weight:700;flex:none}
.chat-in button:disabled{opacity:.4}
.keynote{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12.5px;color:var(--dim);line-height:1.6;margin-bottom:10px}
.keynote .lk{color:var(--acid);font-weight:700}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;background:var(--dim);border-radius:99px;animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>LIFT<span>·</span>COACH</b></div>
    <div class="hbtns">
      <button class="iconbtn" id="btnSettings">⚙︎</button>
    </div>
  </header>
  <main id="main"></main>
  <nav>
    <button data-tab="log" class="on"><span class="ic">📋</span>記録</button>
    <button data-tab="cal"><span class="ic">📅</span>カレンダー</button>
    <button data-tab="prog"><span class="ic">🗂</span>プログラム</button>
    <button data-tab="ex"><span class="ic">🏋️</span>種目</button>
    <button data-tab="rm"><span class="ic">📈</span>RM表</button>
  </nav>
</div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sheet-h"><div class="t" id="sheetTitle"></div><button class="close" id="sheetClose">閉じる</button></div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- numeric keypad -->
<div id="kpad">
  <div class="kp-info"><div><div class="lbl" id="kpLbl"></div><div class="val" id="kpVal"></div></div><button class="done" id="kpDone">完了</button></div>
  <div class="kp-quick" id="kpQuick"></div>
  <div class="kp-grid" id="kpGrid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="liftcoach_v1";
function loadStore(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function saveStore(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const CATS=["胸","肩","腕","背","脚","腹","有酸素"];
const CATCOLOR={"胸":"var(--chest)","肩":"var(--shoulder)","腕":"var(--arm)","背":"var(--back)","脚":"var(--leg)","腹":"var(--abs)","有酸素":"var(--cardio)"};
const SEED=[
 ["ベンチプレス","胸"],["インクラインダンベルプレス","胸"],["ダンベルフライ","胸"],["チェストプレス","胸"],
 ["ショルダープレス","肩"],["サイドレイズ","肩"],["リアレイズ","肩"],
 ["バイセップスカール マシン","腕"],["ハンマーカール","腕"],["ケーブルプルオーバー","腕"],["トライセプスプレスダウン","腕"],
 ["ラットプルダウン","背"],["アシストチンニング","背"],["シーテッドロウ","背"],["ハイ・ロー","背"],
 ["スクワット","脚"],["レッグプレス","脚"],["レッグエクステンション","脚"],["レッグカール","脚"],
 ["アブドミナル","腹"],["ハンギングレッグレイズ","腹"],
 ["トレッドミル","有酸素"],["バイク","有酸素"]
];

let S=loadStore();
if(!S){
  S={exercises:[],sessions:{},program:{},settings:{}};
  SEED.forEach((e,i)=>S.exercises.push({id:"x"+i+"_"+Date.now(),name:e[0],cat:e[1]}));
}
S.program=S.program||{};

function clampRpe(r){r=Math.round(r*2)/2;if(r>10)r=10;if(r<6)r=6;return r;}
function pctOf(reps,rpe){reps=Math.round(reps);if(reps>=1&&reps<=12)return PCT[reps][clampRpe(rpe)]/100;const total=reps+(10-clampRpe(rpe));return 1/(1+total/30);}
function e1rm(w,reps,rpe){if(!w||!reps)return 0;return w/pctOf(reps,rpe);}
function roundStep(x){const s=S.settings.roundTo||2.5;return Math.round(x/s)*s;}
function recWeight(e,reps,rpe){if(!e)return 0;return roundStep(e*pctOf(reps,rpe));}
function fmt(n){if(n==null||isNaN(n))return "—";return (Math.round(n*10)/10).toString().replace(/\.0$/,"");}

/* date */
const WD=["日","月","火","水","木","金","土"];
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseYmd(s){const p=s.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]);}
function daysAgo(s,ref){const a=parseYmd(s);const b=new Date(ref.getFullYear(),ref.getMonth(),ref.getDate());return Math.round((b-a)/86400000);}
let curDate=new Date();
let monthCursor=new Date();
function shiftDay(n){curDate.setDate(curDate.getDate()+n);render();}
function isToday(d){return ymd(d)===ymd(new Date());}
function getDay(){const k=ymd(curDate);if(!S.sessions[k])S.sessions[k]=[];return S.sessions[k];}
function exById(id){return S.exercises.find(e=>e.id===id);}

/* previous entry lookup */
function lastEntry(exId){
  const cur=ymd(curDate);
  const dates=Object.keys(S.sessions).filter(d=>d<cur&&S.sessions[d].some(e=>e.exId===exId)).sort().reverse();
  if(!dates.length)return null;
  const d=dates[0];const day=S.sessions[d];const idx=day.findIndex(e=>e.exId===exId);
  return {date:d,entry:day[idx],indexInDay:idx,daysAgo:daysAgo(d,curDate)};
}
function lastCatDate(cat){
  const today=ymd(new Date());
  const dates=Object.keys(S.sessions).filter(d=>d<=today&&S.sessions[d].some(e=>e.cat===cat&&e.sets.some(s=>s.w&&s.r))).sort().reverse();
  return dates.length?dates[0]:null;
}

function addExerciseToDay(exId){
  const day=getDay();const ex=exById(exId);if(!ex)return;
  const last=lastEntry(exId);
  let sets;
  if(last){sets=last.entry.sets.map(s=>({w:s.w,r:s.r,rpe:""}));if(!sets.length)sets=[{w:"",r:"",rpe:""}];}
  else sets=[{w:"",r:"",rpe:""},{w:"",r:"",rpe:""},{w:"",r:"",rpe:""}];
  day.push({exId,name:ex.name,cat:ex.cat,sets,memo:""});
  saveStore();
}
function bestE1rm(exId){let best=0;Object.values(S.sessions).forEach(day=>day.forEach(en=>{if(en.exId!==exId)return;en.sets.forEach(s=>{if(!s.w||!s.r||s.rpe==="")return;const e=e1rm(+s.w,+s.r,+s.rpe);if(e>best)best=e;});}));return best;}

function cardHTML(en,ei){
  const col=CATCOLOR[en.cat]||"var(--dim)";

  }
  let rows="";

    </div>
    ${(s.w&&s.r&&s.rpe!=="")?`<div class="e1rm">推定1RM <b>${fmt(e)}kg</b> ・ あと${fmt(10-clampRpe(+s.rpe))}回</div>`:``}`;
  });

  </div>`;
}

function coachFor(en){
  // 分析対象 = 重量・回数・RPE が揃った最後のセット（RPEなしのアップは無視）
  let idx=-1;for(let i=en.sets.length-1;i>=0;i--){const s=en.sets[i];if(s.w&&s.r&&s.rpe!==""){idx=i;break;}}
  const hasAny=en.sets.some(s=>s.w&&s.r);
  if(idx<0){
    if(!hasAny)return {html:""};
    return {html:`<div class="coach"><div class="ttl">COACH ／ RM換算表ベース</div><div class="msg">RPEを入れると、RM換算表をもとに次セットを提案します。<b>ウォームアップのセットはRPE不要</b>（空欄のままでOK）。</div></div>`};
  }
  const s=en.sets[idx];const w=+s.w,r=+s.r,rpe=+s.rpe;
  const e=e1rm(w,r,rpe);const tE=S.settings.targetRpe;
  const recSame=recWeight(e,r,tE);
  let msg="";
  const diff=clampRpe(rpe)-tE;
  if(Math.abs(diff)<0.6)msg=`今の<b>RPE${fmt(rpe)}</b>は目標どおり。次も<b>${fmt(w)}kg × ${r}回</b>を維持、余裕あれば+${fmt(S.settings.roundTo)}kg。`;
  else if(diff<0)msg=`<b>RPE${fmt(rpe)}</b>はまだ余裕あり（目標${tE}）。次は<b>${fmt(recSame)}kg × ${r}回</b>が目安。`;
  else msg=`<b>RPE${fmt(rpe)}</b>は目標(${tE})より高め＝疲労気味。次は<b>${fmt(recSame)}kg × ${r}回</b>に落として質を保ちましょう。`;
  const ctx={name:en.name,setNo:idx+1,w,r,rpe,e1rm:e,exId:en.exId};
  return {html:`<div class="coach"><div class="ttl">COACH ／ RM換算表ベース（推定1RM ${fmt(e)}kg）</div><div class="msg">${msg}</div>
    <div class="acts"><button class="btn-copy" style="flex:1" onclick='copyCtx(${jenc(ctx)})'>📋 記録をコピー（AIアプリに貼って相談）</button></div></div>`};
}

/* premise + context */
function premiseLine(){const st=S.settings;return `目標:${st.goal} / レベル:${st.level}`+(st.profileNotes?` / 補足:${st.profileNotes}`:"");}
function ctxText(c){
  const last=lastEntry(c.exId);
  let p=`[前提] ${premiseLine()}\n【種目】${c.name}（${c.setNo}セット目）\n今回: ${fmt(c.w)}kg × ${c.r}回${c.rpe!=null?` @ RPE${fmt(c.rpe)}`:""}（推定1RM 約${fmt(c.e1rm)}kg）`;
  if(last){const t=last.entry.sets.filter(s=>s.w&&s.r).map(s=>`${fmt(+s.w)}×${s.r}${s.rpe?'@'+fmt(+s.rpe):''}`).join(", ");if(t)p+=`\n前回(${last.daysAgo}日前): ${t}`;}
  p+=`\n目標設定: RPE${S.settings.targetRpe}/${S.settings.targetReps}回・${S.settings.roundTo}kg刻み\n\n次セットの重量と回数を提案してください。`;

}
function copyCtx(c){const t=ctxText(c);const done=()=>toast("記録をコピーしました");if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));else fallbackCopy(t,done);}
function fallbackCopy(t,cb){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand("copy");cb();}catch(e){toast("コピー失敗");}document.body.removeChild(ta);}

  const chips=p.ex.map(id=>{const ex=exById(id);if(!ex)return"";return `<span class="progchip"><i style="background:${CATCOLOR[ex.cat]}"></i>${esc(ex.name)}<button onclick="progRm('${id}')" style="color:var(--danger);font-weight:700;margin-left:2px">×</button></span>`;}).join("");
  openSheet(WD[wd]+"曜日のプログラム",
    `<div class="field"><label>タイトル（例: 胸・三頭）</label><input id="pgTitle" value="${esc(p.title||'')}" placeholder="部位やテーマ"></div>
     <div class="field"><label>種目</label><div class="progchips" id="pgChips">${chips||'<span style="color:var(--dim2);font-size:13px">未設定</span>'}</div></div>
     <button class="ghost" onclick="progPick()">＋ 種目を追加</button>
     <button class="primary" id="pgSave">保存</button>`);
  document.getElementById("pgSave").onclick=()=>{const t=document.getElementById("pgTitle").value.trim();S.program[wd]=S.program[wd]||{title:"",ex:[]};S.program[wd].title=t;saveStore();closeSheet();render();toast("保存しました");};
}
function progRm(id){const p=S.program[_progWd];p.ex=p.ex.filter(x=>x!==id);saveStore();editProg(_progWd);}
function progPick(){
  const t=document.getElementById("pgTitle").value.trim();S.program[_progWd]=S.program[_progWd]||{title:"",ex:[]};S.program[_progWd].title=t;
  let h=`<div class="cats" style="padding-bottom:10px">`+CATS.map(c=>`<button data-c="${c}" class="${c===exCat?'on':''}" style="${c===exCat?'background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]:''}" onclick="ppFilter('${c}')">${c}</button>`).join("")+`</div><div id="ppList"></div>`;
  openSheet("プログラムに種目を追加",h);ppList(exCat);
}
function ppFilter(c){exCat=c;document.querySelectorAll('#sheetBody .cats button').forEach(b=>{b.classList.toggle('on',b.dataset.c===c);b.style.cssText=b.dataset.c===c?('background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]):'';});ppList(c);}
function ppList(c){const list=S.exercises.filter(e=>e.cat===c).sort((a,b)=>a.name.localeCompare(b.name,"ja"));document.getElementById("ppList").innerHTML=list.map(e=>`<div class="pickrow"><div class="bar" style="width:5px;height:24px;border-radius:99px;background:${CATCOLOR[e.cat]}"></div><div class="nm">${esc(e.name)}</div><button class="add" style="color:var(--acid);font-size:24px;width:34px" onclick="ppAdd('${e.id}')">＋</button></div>`).join("");}
function ppAdd(id){const p=S.program[_progWd];if(!p.ex.includes(id))p.ex.push(id);saveStore();editProg(_progWd);}

/* ---------- exercises ---------- */
let exCat="胸";
function renderEx(){
  let h=`<div class="cats">`+CATS.map(c=>`<button class="${c===exCat?'on':''}" style="${c===exCat?'background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]:''}" onclick="setCat('${c}')">${c}</button>`).join("")+`</div>`;
  const list=S.exercises.filter(e=>e.cat===exCat).sort((a,b)=>a.name.localeCompare(b.name,"ja"));
  if(list.length===0)h+=`<div class="empty-day" style="padding-top:20px">この部位の種目がありません</div>`;
  list.forEach(e=>{const b=bestE1rm(e.id);h+=`<div class="exrow"><div class="bar" style="background:${CATCOLOR[e.cat]}"></div><div class="nm">${esc(e.name)}</div>${b?`<div class="pr">1RM ${fmt(b)}kg</div>`:''}<button class="add" onclick="addToTodayFromEx('${e.id}')">＋</button><button class="del" onclick="delExercise('${e.id}')">🗑</button></div>`;});
  h+=`<button class="addex" style="margin-top:16px" onclick="openNewExercise()">＋ 新しい種目を作成</button>`;
  main.innerHTML=h;
}
function setCat(c){exCat=c;render();}
function addToTodayFromEx(id){curDate=new Date();tab="log";addExerciseToDay(id);render();toast("今日に追加しました");}
function delExercise(id){openConfirm("種目を削除","この種目を一覧から削除します（過去の記録は残ります）。",()=>{S.exercises=S.exercises.filter(e=>e.id!==id);saveStore();render();closeSheet();});}

/* ---------- RM ---------- */
function renderRM(){
  const best=S.exercises.map(e=>({e,b:bestE1rm(e.id)})).filter(x=>x.b>0).sort((a,b)=>b.b-a.b);
  if(best.length===0){main.innerHTML=`<div class="empty-day" style="padding-top:40px"><div class="big">📈</div>RPE付きで記録すると<br>RM換算表が表示されます</div>`;return;}
  let sel=window._rmSel||best[0].e.id;if(!best.find(x=>x.e.id===sel))sel=best[0].e.id;window._rmSel=sel;
  let h=`<div class="field" style="margin-bottom:18px"><label>種目を選択</label><select id="rmSelect">${best.map(x=>`<option value="${x.e.id}" ${x.e.id===sel?'selected':''}>${esc(x.e.name)} (1RM ${fmt(x.b)}kg)</option>`).join("")}</select></div>`;
  const cur=best.find(x=>x.e.id===sel);const E=cur.b;
  h+=`<div class="card" style="padding:14px"><div style="font-size:10px;letter-spacing:.14em;color:var(--acid);font-weight:700;margin-bottom:4px">推定1RM</div><div style="font-family:var(--num);font-size:38px;font-weight:700;line-height:1">${fmt(E)} <span style="font-size:18px;color:var(--dim)">kg</span></div><div style="font-size:12px;color:var(--dim);margin-top:4px">${esc(cur.e.name)} の自己ベストから算出</div></div>`;
  const reps=[1,2,3,4,5,6,8,10,12],rpes=[10,9,8,7];
  h+=`<table class="rmtable"><thead><tr><th>回数</th>${rpes.map(r=>`<th>RPE${r}</th>`).join("")}</tr></thead><tbody>`;
  reps.forEach(rp=>{h+=`<tr><td style="color:var(--dim)">${rp}回</td>`+rpes.map(rr=>{const w=roundStep(E*pctOf(rp,rr));const hl=(rp===S.settings.targetReps&&rr===S.settings.targetRpe);return `<td>${hl?'<b>'+fmt(w)+'</b>':fmt(w)}</td>`;}).join("")+`</tr>`;});
  h+=`</tbody></table><div class="hint">各セルは「その回数を指定RPEで挙げられる重量」の目安（緑＝目標 ${S.settings.targetReps}回/RPE${S.settings.targetRpe}）。RPE10＝限界、RPE8＝あと2回。${S.settings.roundTo}kg刻み。</div>`;
  main.innerHTML=h;
  document.getElementById("rmSelect").addEventListener("change",e=>{window._rmSel=e.target.value;render();});
}

/* ---------- sheets ---------- */
const sheet=document.getElementById("sheet"),sheetBg=document.getElementById("sheetBg"),sheetTitle=document.getElementById("sheetTitle"),sheetBody=document.getElementById("sheetBody");
function openSheet(t,h){sheetTitle.textContent=t;sheetBody.innerHTML=h;sheet.classList.add("on");sheetBg.classList.add("on");}
function closeSheet(){sheet.classList.remove("on");sheetBg.classList.remove("on");}
document.getElementById("sheetClose").onclick=closeSheet;sheetBg.onclick=closeSheet;

function openPickExercise(){
  let h=`<div class="cats" style="padding-bottom:10px">`+CATS.map(c=>`<button data-c="${c}" class="${c===exCat?'on':''}" style="${c===exCat?'background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]:''}" onclick="pickFilter('${c}')">${c}</button>`).join("")+`</div><div id="pickList"></div>`;
  openSheet("種目を追加",h);renderPickList(exCat);
}
function pickFilter(c){exCat=c;document.querySelectorAll('#sheetBody .cats button').forEach(b=>{b.classList.toggle('on',b.dataset.c===c);b.style.cssText=b.dataset.c===c?('background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]):'';});renderPickList(c);}
function renderPickList(c){const list=S.exercises.filter(e=>e.cat===c).sort((a,b)=>a.name.localeCompare(b.name,"ja"));document.getElementById("pickList").innerHTML=list.map(e=>{const last=lastEntry(e.id);return `<div class="pickrow"><div class="bar" style="width:5px;height:24px;border-radius:99px;background:${CATCOLOR[e.cat]}"></div><div class="nm">${esc(e.name)}${last?`<div style="font-size:11px;color:var(--dim)">前回 ${last.daysAgo}日前</div>`:''}</div><button class="add" style="color:var(--acid);font-size:24px;width:34px" onclick="pickAdd('${e.id}')">＋</button></div>`;}).join("")+`<button class="ghost" onclick="openNewExercise()">＋ 新しい種目を作成</button>`;}
function pickAdd(id){addExerciseToDay(id);closeSheet();render();toast("追加しました");}

function openNewExercise(){
  let sel=exCat;
  openSheet("新しい種目",`<div class="field"><label>種目名</label><input id="neName" placeholder="例: インクラインベンチプレス"></div><div class="field"><label>部位</label><div class="catpick" id="neCats">${CATS.map(c=>`<button data-c="${c}" class="${c===sel?'on':''}" style="${c===sel?'background:'+CATCOLOR[c]+';border-color:'+CATCOLOR[c]+';color:#0a0c0e':''}">${c}</button>`).join("")}</div></div><button class="primary" id="neSave">作成</button>`);
  sheetBody.querySelectorAll("#neCats button").forEach(b=>b.onclick=()=>{sel=b.dataset.c;sheetBody.querySelectorAll("#neCats button").forEach(x=>{const on=x.dataset.c===sel;x.classList.toggle("on",on);x.style.cssText=on?('background:'+CATCOLOR[sel]+';border-color:'+CATCOLOR[sel]+';color:#0a0c0e'):'';});});
  document.getElementById("neSave").onclick=()=>{const nm=document.getElementById("neName").value.trim();if(!nm){toast("名前を入力してください");return;}S.exercises.push({id:"x"+Date.now(),name:nm,cat:sel});saveStore();exCat=sel;closeSheet();render();toast("種目を作成しました");};
}
function openConfirm(t,m,onYes){openSheet(t,`<div style="font-size:14px;color:var(--dim);line-height:1.7;margin-bottom:18px">${m}</div><button class="primary" id="cfY" style="background:var(--danger);color:#fff">削除する</button><button class="ghost" onclick="closeSheet()">キャンセル</button>`);document.getElementById("cfY").onclick=onYes;}

/* ---------- settings ---------- */
document.getElementById("btnSettings").onclick=openSettings;
function openSettings(){
  const st=S.settings;
  const goals=["筋肥大","筋力アップ","減量・カット","維持・健康"],levels=["初心者","中級者","上級者"];
  const h=`
  <div class="field"><label>トレーニングの目的（AIに自動で伝わります）</label><div class="segpick" id="seGoal">${goals.map(g=>`<button data-v="${g}" class="${g===st.goal?'on':''}">${g}</button>`).join("")}</div></div>
  <div class="field"><label>レベル</label><div class="segpick" id="seLevel">${levels.map(g=>`<button data-v="${g}" class="${g===st.level?'on':''}">${g}</button>`).join("")}</div></div>
  <div class="field"><label>補足（任意・けが/弱点/方針など）</label><textarea id="seNotes" placeholder="例: 右肩に違和感あり。脚は週1。">${esc(st.profileNotes||'')}</textarea></div>
  <div style="border-top:1px solid var(--line);margin:6px 0 16px"></div>
  <div class="field"><label>目標RPE（次セット提案の基準）</label><select id="seRpe">${[10,9.5,9,8.5,8,7.5,7,6.5,6].map(v=>`<option ${v===st.targetRpe?'selected':''}>${v}</option>`).join("")}</select></div>
  <div class="field"><label>目標レップ数</label><select id="seReps">${[1,2,3,4,5,6,8,10,12].map(v=>`<option ${v===st.targetReps?'selected':''}>${v}</option>`).join("")}</select></div>
  <div class="field"><label>重量の丸め単位 (kg)</label><select id="seRound">${[0.5,1,1.25,2.5,5].map(v=>`<option ${v===st.roundTo?'selected':''}>${v}</option>`).join("")}</select></div>
  <div style="border-top:1px solid var(--line);margin:6px 0 16px"></div>
  <div class="keynote">AIへの相談は、各種目の <span class="lk">「📋記録をコピー」</span> で記録・前回データ・あなたの目標をまとめてコピーし、Claude / ChatGPT / Gemini などお使いのアプリに貼り付けてください。アプリ内のAPI連携は使いません（追加課金なし）。</div>
  <button class="primary" id="seSave">保存</button>`;
  openSheet("設定",h);
  let g=st.goal,lv=st.level;
  sheetBody.querySelectorAll("#seGoal button").forEach(b=>b.onclick=()=>{g=b.dataset.v;sheetBody.querySelectorAll("#seGoal button").forEach(x=>x.classList.toggle("on",x.dataset.v===g));});
  sheetBody.querySelectorAll("#seLevel button").forEach(b=>b.onclick=()=>{lv=b.dataset.v;sheetBody.querySelectorAll("#seLevel button").forEach(x=>x.classList.toggle("on",x.dataset.v===lv));});
  document.getElementById("seSave").onclick=()=>{
    st.goal=g;st.level=lv;st.profileNotes=document.getElementById("seNotes").value.trim();
    st.targetRpe=parseFloat(document.getElementById("seRpe").value);st.targetReps=parseInt(document.getElementById("seReps").value);st.roundTo=parseFloat(document.getElementById("seRound").value);
    saveStore();closeSheet();render();toast("設定を保存しました");
  };
}

/* ---------- utils ---------- */
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function jenc(o){return esc(JSON.stringify(o));}
let toastT;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1700);}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
render();
</script>
</body>
</html>
